[project]
name = "mtv-audit"
version = "0.1.0"
description = "MTV (Marginal Token Value) waste audit for agent session logs — Stage 1 of the MTV business"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mtv-audit = "mtv_audit.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mtv_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
